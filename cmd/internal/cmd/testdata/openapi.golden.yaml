components:
  schemas:
    AcceptedMethod:
      description: AcceptedMethod defines a method for evaluation or enforcement.
      properties:
        description:
          type: string
        executor:
          $ref: "#/components/schemas/Actor"
        id:
          type: string
        mode:
          $ref: "#/components/schemas/ModeType"
        required:
          default: false
          type: boolean
        type:
          $ref: "#/components/schemas/MethodType"
      required:
      - id
      - type
      - mode
      type: object
      x-status: experimental
    AcceptedRisk:
      description: |-
        AcceptedRisk documents a risk the organization has chosen to accept,
        optionally linking it to a mitigated risk when the acceptance covers
        residual risk after partial mitigation.
      properties:
        id:
          description: id allows this accepted risk entry to be referenced
          type: string
        justification:
          description: justification explains why the risk is accepted
          type: string
        risk:
          allOf:
          - $ref: "#/components/schemas/EntryMapping"
          description: risk references the risk being accepted
        scope:
          allOf:
          - $ref: "#/components/schemas/Scope"
          description: scope defines where the risk acceptance applies
        target-id:
          description: target-id optionally links this acceptance to a mitigated risk entry
          type: string
      required:
      - id
      - risk
      type: object
      x-status: experimental
    ActionResult:
      description: ActionResult captures a performed enforcement action.
      properties:
        disposition:
          allOf:
          - $ref: "#/components/schemas/Disposition"
          description: disposition is the enforcement action taken
        end:
          allOf:
          - $ref: "#/components/schemas/Datetime"
          description: end is the timestamp when the enforcement action concluded
        id:
          description: id allows this entry to be referenced by other elements
          type: string
        justification:
          allOf:
          - $ref: "#/components/schemas/Justification"
          description: |-
            justification links the action to the findings that prompted it and any
            applicable exceptions. A Clear action has nothing to justify, so it is
            absent there and required everywhere else.
        message:
          description: message provides additional context about the action
          type: string
        method:
          allOf:
          - $ref: "#/components/schemas/EntryMapping"
          description: method references the specific AcceptedMethod entry within the Policy being enforced
        start:
          allOf:
          - $ref: "#/components/schemas/Datetime"
          description: start is the timestamp when the enforcement action began
        steps:
          description: steps references the code paths or addresses that carried out this enforcement action
          items:
            $ref: "#/components/schemas/EnforcementStep"
          minItems: 1
          type: array
      required:
      - id
      - disposition
      - method
      - start
      - steps
      type: object
      x-status: experimental
    Actor:
      allOf:
      - $ref: "#/components/schemas/Entity"
      description: Actor represents an entity (human or tool) that performs actions in evaluations
      properties:
        contact:
          allOf:
          - $ref: "#/components/schemas/Contact"
          description: contact is contact information for the actor
      type: object
      x-status: stable
    Adherence:
      description: Adherence defines evaluation methods, assessment plans, enforcement methods, and non-compliance notifications.
      properties:
        assessment-plans:
          items:
            $ref: "#/components/schemas/AssessmentPlan"
          minItems: 1
          type: array
        enforcement-methods:
          items:
            allOf:
            - $ref: "#/components/schemas/AcceptedMethod"
            - required:
              - type
            properties:
              type:
                $ref: "#/components/schemas/EnforcementMethodType"
            type: object
          minItems: 1
          type: array
        evaluation-methods:
          items:
            allOf:
            - $ref: "#/components/schemas/AcceptedMethod"
            - required:
              - type
            properties:
              type:
                $ref: "#/components/schemas/EvaluationMethodType"
            type: object
          minItems: 1
          type: array
        non-compliance:
          type: string
      type: object
      x-status: experimental
    ArtifactMapping:
      description: ArtifactMapping represents a mapping to an external artifact or artifact entry
      properties:
        reference-id:
          description: reference-id identifies an element from a MappingReference in the artifact's metadata
          type: string
        remarks:
          description: remarks is prose regarding the mapped artifact or the mapping relationship
          type: string
      required:
      - reference-id
      type: object
      x-status: stable
    ArtifactType:
      description: ArtifactType identifies the kind of Gemara artifact for unambiguous parsing
      enum:
      - CapabilityCatalog
      - ControlCatalog
      - GuidanceCatalog
      - ThreatCatalog
      - RiskCatalog
      - Policy
      - MappingDocument
      - Lexicon
      - EvaluationLog
      - EnforcementLog
      - VectorCatalog
      - PrincipleCatalog
      - AuditLog
      type: string
      x-status: stable
    AssessmentLog:
      description: AssessmentLog contains the results of executing a single assessment procedure for a control requirement.
      properties:
        applicability:
          description: Applicability is elevated from the Layer 2 Assessment Requirement to aid in execution and reporting.
          items:
            type: string
          minItems: 1
          type: array
        confidence-level:
          allOf:
          - $ref: "#/components/schemas/ConfidenceLevel"
          description: ConfidenceLevel indicates the evaluator's confidence level in this specific assessment result.
        description:
          description: Description provides a summary of the assessment procedure.
          type: string
        end:
          allOf:
          - $ref: "#/components/schemas/Datetime"
          description: End is the timestamp when the assessment concluded.
        evidence:
          description: Evidence records the raw data cited to support this assessment's opinion.
          items:
            allOf:
            - $ref: "#/components/schemas/Evidence"
            type: object
          minItems: 1
          type: array
        message:
          description: Message provides additional context about the assessment result.
          type: string
        plan:
          allOf:
          - $ref: "#/components/schemas/EntryMapping"
          description: Plan maps to the policy assessment plan being executed.
        recommendation:
          description: Recommendation provides guidance on how to address a failed assessment.
          type: string
        requirement:
          allOf:
          - $ref: "#/components/schemas/EntryMapping"
          description: Requirement should map to the assessment requirement for this assessment.
        result:
          allOf:
          - $ref: "#/components/schemas/Result"
          description: Result is the overall outcome of the assessment procedure, matching the result of the last step that was run.
        start:
          allOf:
          - $ref: "#/components/schemas/Datetime"
          description: |-
            Start is the timestamp when the assessment began.
            Assessments that never executed have no start time to record.
        steps:
          description: Steps are sequential actions taken as part of the assessment, which may halt the assessment if a failure occurs.
          items:
            $ref: "#/components/schemas/AssessmentStep"
          minItems: 1
          type: array
        steps-executed:
          description: Steps-executed is the number of steps that were executed as part of the assessment.
          type: integer
      required:
      - requirement
      - description
      - result
      - message
      - applicability
      - steps
      type: object
      x-status: stable
    AssessmentPlan:
      description: AssessmentPlan defines how a specific assessment requirement is evaluated.
      properties:
        evaluation-methods:
          items:
            allOf:
            - $ref: "#/components/schemas/AcceptedMethod"
            - required:
              - type
            properties:
              type:
                $ref: "#/components/schemas/EvaluationMethodType"
            type: object
          minItems: 1
          type: array
        evidence-requirements:
          type: string
        frequency:
          type: string
        id:
          type: string
        parameters:
          items:
            $ref: "#/components/schemas/Parameter"
          minItems: 1
          type: array
        requirement-id:
          type: string
      required:
      - id
      - requirement-id
      - frequency
      - evaluation-methods
      type: object
      x-status: experimental
    AssessmentRequirement:
      description: AssessmentRequirement describes a tightly scoped, verifiable condition that must be satisfied and confirmed by an evaluator
      properties:
        applicability:
          description: applicability is a list of strings describing the situations where this text functions as a requirement for its parent control
          items:
            type: string
          minItems: 1
          type: array
        id:
          description: id allows this entry to be referenced by other elements
          type: string
        recommendation:
          description: recommendation provides readers with non-binding suggestions to aid in evaluation or enforcement of the requirement
          type: string
        replaced-by:
          allOf:
          - $ref: "#/components/schemas/EntryMapping"
          description: replaced-by references the assessment requirement that supersedes this one when deprecated or retired
        state:
          allOf:
          - $ref: "#/components/schemas/Lifecycle"
          default: Active
          description: state is the lifecycle state of this assessment requirement
        text:
          description: text is the body of the requirement, typically written as a MUST condition
          type: string
      required:
      - id
      - text
      - applicability
      type: object
      x-status: stable
    AssessmentRequirementModifier:
      description: AssessmentRequirementModifier allows organizations to customize assessment requirements based on how an organization wants to gather evidence for the objective.
      properties:
        applicability:
          description: The updated applicability of the assessment requirement
          items:
            type: string
          minItems: 1
          type: array
        id:
          type: string
        modification-rationale:
          type: string
        modification-type:
          $ref: "#/components/schemas/ModType"
        recommendation:
          description: The updated recommendation for the assessment requirement
          type: string
        target-id:
          type: string
        text:
          description: The updated text of the assessment requirement
          type: string
      required:
      - id
      - target-id
      - modification-type
      - modification-rationale
      type: object
      x-status: experimental
    AssessmentStep:
      type: string
      x-status: stable
    AuditLog:
      allOf:
      - $ref: "#/components/schemas/Log"
      - required:
        - metadata
        - summary
        - opinion
        - policy
        - verifications
      description: AuditLog records results from an audit performed against a target resource
      properties:
        findings:
          description: "findings are what this audit reports: the called-out determinations, each\nnaming the requirement or the risk it concerns. verifications is the\nsystematic view, one entry per requirement; this is the selective one, and\nthe only one that reasons. It is absent when the audit had nothing to call\nout, which is what a Passed opinion looks like."
          items:
            $ref: "#/components/schemas/ComplianceFinding"
          type: array
        metadata:
          description: metadata provides detailed data about this log
          properties:
            type:
              enum:
              - AuditLog
              type: string
          required:
          - type
          type: object
        opinion:
          allOf:
          - $ref: "#/components/schemas/Opinion"
          description: |-
            opinion is that same conclusion in one word, so a consumer of the
            attestation need not weigh the findings itself. summary carries the prose;
            this is the machine-readable one. Anything other than Passed is expected to
            be explained by findings, documented rather than enforced.
        owner:
          allOf:
          - $ref: "#/components/schemas/RACI"
          description: owner defines the RACI roles responsible for managing the audit
        policy:
          allOf:
          - $ref: "#/components/schemas/ArtifactMapping"
          description: "policy is this audit's criteria in ISO 19011's sense: the single versioned\nartifact the evidence was compared against. It is one policy rather than a\nlist because the policy is also what defines scope — selection, exclusions\nand applicability — and the audit's completeness claim has nothing to be\ncomplete against without a governed set. Auditing a baseline means authoring\na policy that imports it; auditing against several criteria means one policy\nthat imports them all.\n\nThis does not hide the criteria's content: the underlying catalogs stay named\nin metadata.mapping-references, and each verification carries the requirement\nas resolved, so a reader sees what was required without fetching the policy.\nIt does mean the bare plan-id and method-id references elsewhere in this file\nare legal only while the criteria is singular — with one policy pinned here,\nnothing else needs a qualifier."
        summary:
          description: summary provides the high-level conclusion
          type: string
        verifications:
          description: "verifications records, for every requirement, what was mechanically checked\nand how it came out. It is complete by construction — one entry per\nrequirement, including the boring passes — and carries no reasoning: it is\nthe audit's counterpart of #ControlEvaluation, not of #ComplianceFinding."
          items:
            $ref: "#/components/schemas/VerificationLog"
          minItems: 1
          type: array
      type: object
      x-status: experimental
    Capability:
      description: Capability describes a system capability such as a feature, component or object.
      properties:
        description:
          description: description provides a detailed overview of this capability
          type: string
        group:
          description: group references by id a catalog group that this capability belongs to
          type: string
        id:
          description: id allows this entry to be referenced by other elements
          type: string
        title:
          description: title describes this capability at a glance
          type: string
      required:
      - id
      - title
      - description
      - group
      type: object
      x-status: stable
    CapabilityCatalog:
      allOf:
      - $ref: "#/components/schemas/Catalog"
      - required:
        - metadata
      description: CapabilityCatalog describes a collection of system capabilities
      properties:
        capabilities:
          description: capabilities is a list of capabilities defined by this catalog
          items:
            $ref: "#/components/schemas/Capability"
          minItems: 1
          type: array
        metadata:
          description: metadata provides detailed data about this catalog
          properties:
            type:
              enum:
              - CapabilityCatalog
              type: string
          required:
          - type
          type: object
      type: object
      x-status: stable
    Catalog:
      description: Catalog describes a set of topically-associated entries
      properties:
        extends:
          description: extends references catalogs that this catalog builds upon
          items:
            $ref: "#/components/schemas/ArtifactMapping"
          type: array
        groups:
          description: groups contains a list of groups that can be referenced by entries in this catalog
          items:
            $ref: "#/components/schemas/Group"
          minItems: 1
          type: array
        imports:
          items:
            $ref: "#/components/schemas/MultiEntryMapping"
          minItems: 1
          type: array
        metadata:
          allOf:
          - $ref: "#/components/schemas/Metadata"
          description: metadata provides detailed data about this catalog
        title:
          description: title describes the purpose of this catalog at a glance
          type: string
      required:
      - title
      - metadata
      type: object
      x-status: stable
    CatalogImport:
      description: CatalogImport defines how to import control catalogs with optional exclusions, constraints, and assessment requirement modifications.
      properties:
        assessment-requirement-modifications:
          items:
            $ref: "#/components/schemas/AssessmentRequirementModifier"
          minItems: 1
          type: array
        constraints:
          items:
            $ref: "#/components/schemas/Constraint"
          minItems: 1
          type: array
        exclusions:
          items:
            type: string
          minItems: 1
          type: array
        reference-id:
          type: string
      required:
      - reference-id
      type: object
      x-status: experimental
    ComplianceFinding:
      allOf:
      - $ref: "#/components/schemas/Finding"
      - required:
        - status
        - id
      description: "ComplianceFinding is what an audit reports in its own right: a finding carrying\nthe audit's compliance determination. It is the only record in Gemara that\ndecides compliance, and the audit's counterpart of #ActionResult — the record\ntype this log carries a list of."
      properties:
        id:
          description: "id uniquely identifies this finding within the audit. It is declared here\nrather than in the #Finding core because a finding reported against a named\ncheck needs no id of its own, while this one is reported in its own right."
          type: string
        risk:
          allOf:
          - $ref: "#/components/schemas/EntryMapping"
          description: "risk names the risk this finding concerns, when it concerns one: a residual\nrisk beyond its category's tolerance, for example. A finding names a risk or\na requirement — the requirement comes from the #Finding core."
        status:
          allOf:
          - $ref: "#/components/schemas/ComplianceStatus"
          description: "status is the audit's compliance determination for what this finding\nconcerns. Only the audit decides whether a requirement is satisfied: an\nevaluation says whether its procedure passed, an enforcement action says\nwhat it did. It carries OCSF's compliance.status."
      type: object
      x-status: experimental
    ComplianceStatus:
      description: "ComplianceStatus is whether the target complies with one requirement. It is the\naudit's conclusion, which an auditor may reach differently from what the\nassessment observed, and it is what projects to OCSF's compliance.status.\nCompliance is stated one requirement at a time: there is no \"compliant with\nexceptions\" here, because weighing exceptions is a judgement about the target as\na whole, which belongs to #Opinion."
      enum:
      - Compliant
      - Not Compliant
      - Not Applicable
      - Undetermined
      type: string
      x-status: experimental
    ConfidenceLevel:
      description: ConfidenceLevel indicates the evaluator's confidence level in an assessment result.
      enum:
      - Undetermined
      - Low
      - Medium
      - High
      type: string
      x-status: stable
    Constraint:
      description: Constraint defines a prescriptive requirement that applies to a specific guidance or control.
      properties:
        id:
          description: Unique ID for this constraint to enable Layer 5/6 tracking
          type: string
        target-id:
          description: Links to the specific Guidance or Control being constrained
          type: string
        text:
          description: The prescriptive requirement/constraint text
          type: string
      required:
      - id
      - target-id
      - text
      type: object
      x-status: experimental
    Contact:
      description: Contact is the contact information for a person or group
      properties:
        affiliation:
          description: affiliation is the organization with which the contact entity is associated, such as a team, school, or employer
          type: string
        email:
          allOf:
          - $ref: "#/components/schemas/Email"
          description: email is the preferred email address to reach the contact
        name:
          description: name is the preferred descriptor for the contact entity
          type: string
        social:
          description: social is a social media handle or other profile for the contact, such as GitHub
          type: string
      required:
      - name
      type: object
      x-status: stable
    Control:
      description: Control describes a safeguard or countermeasure with a clear objective and assessment requirements
      properties:
        assessment-requirements:
          description: assessment-requirements is a list of requirements that must be verified to confirm the control objective has been met
          items:
            $ref: "#/components/schemas/AssessmentRequirement"
          minItems: 1
          type: array
        group:
          description: group references by id a catalog group that this control belongs to
          type: string
        guidelines:
          description: guidelines documents relationships between this control and Layer 1 guideline artifacts
          items:
            $ref: "#/components/schemas/MultiEntryMapping"
          minItems: 1
          type: array
        id:
          description: id allows this entry to be referenced by other elements
          type: string
        objective:
          description: objective is a unified statement of intent, which may encompass multiple situationally applicable requirements
          type: string
        replaced-by:
          allOf:
          - $ref: "#/components/schemas/EntryMapping"
          description: replaced-by references the control that supersedes this one when deprecated or retired
        state:
          allOf:
          - $ref: "#/components/schemas/Lifecycle"
          default: Active
          description: state is the lifecycle state of this control
        threats:
          description: threats documents relationships between this control and Layer 2 threat artifacts
          items:
            $ref: "#/components/schemas/MultiEntryMapping"
          minItems: 1
          type: array
        title:
          description: title describes the purpose of this control at a glance
          type: string
      required:
      - id
      - title
      - objective
      - group
      - assessment-requirements
      type: object
      x-status: stable
    ControlCatalog:
      allOf:
      - $ref: "#/components/schemas/Catalog"
      - required:
        - metadata
      description: ControlCatalog describes a set of related controls and relevant metadata
      properties:
        controls:
          description: |-
            controls is a list of unique controls defined by this catalog
            
            (Enforced by the CUE schema; not by this OpenAPI projection.)
          items:
            $ref: "#/components/schemas/Control"
          minItems: 1
          type: array
        metadata:
          description: metadata provides detailed data about this catalog
          properties:
            type:
              enum:
              - ControlCatalog
              type: string
          required:
          - type
          type: object
      type: object
      x-status: stable
    ControlEvaluation:
      description: ControlEvaluation contains the results of evaluating a single Layer 5 control.
      properties:
        assessment-logs:
          description: |-
            Enforce that control reference and the assessments' references match
            This formulation uses the control's reference if the assessment doesn't include a reference
            
            
            Require start timestamp on assessments that actually executed
            
            (Enforced by the CUE schema; not by this OpenAPI projection.)
          items:
            allOf:
            - $ref: "#/components/schemas/AssessmentLog"
            - required:
              - requirement
            properties:
              requirement:
                properties:
                  reference-id:
                    type: string
                required:
                - reference-id
                type: object
            type: object
          minItems: 1
          type: array
        control:
          $ref: "#/components/schemas/EntryMapping"
        message:
          type: string
        name:
          type: string
        result:
          $ref: "#/components/schemas/Result"
      required:
      - name
      - result
      - message
      - control
      - assessment-logs
      type: object
      x-status: stable
    Datetime:
      description: Datetime represents an ISO 8601 formatted datetime string
      format: date-time
      type: string
      x-status: stable
    Determination:
      description: "Determination is what a named check in a verification found: whether the\ncondition the check names holds. It is deliberately not #Result's vocabulary —\n#Result says whether an assessment procedure passed when it ran — and\ndeliberately not #ComplianceStatus: a check asserts a condition, while\ncompliance is what an audit concludes from the checks and the evidence\ntogether. Undetermined is the word #Disposition already uses for \"could not be\ntold\"."
      enum:
      - Satisfied
      - Not Satisfied
      - Not Applicable
      - Undetermined
      type: string
      x-status: experimental
    Dimensions:
      description: Dimensions specify the applicability criteria for a policy
      properties:
        geopolitical:
          description: geopolitical is an optional list of geopolitical regions
          items:
            type: string
          minItems: 1
          type: array
        groups:
          items:
            type: string
          minItems: 1
          type: array
        sensitivity:
          description: sensitivity is an optional list of data classification levels
          items:
            type: string
          minItems: 1
          type: array
        technologies:
          description: technologies is an optional list of technology categories or services
          items:
            type: string
          minItems: 1
          type: array
        users:
          description: users is an optional list of user roles
          items:
            type: string
          minItems: 1
          type: array
      type: object
      x-status: experimental
    Disposition:
      description: "Disposition is what an enforcement gate did. It rolls up from an action to the\nlog by the precedence Enforced > Tolerated > Undetermined > Clear: a log where\nanything was enforced is Enforced, and Clear only survives when every action\nwas. The strongest action dominates because a disposition records what the\nenforcement layer did; how much that should worry anyone is the audit's\nquestion, answered there by determinations, severities and lifecycles.\n\nA disposition is not a finding's lifecycle. Blocking a merge is Enforced while\nthe finding it blocked stays Open, since the gate prevented harm without fixing\nanything; a remediation is also Enforced and does leave its finding Resolved.\nThe one correspondence that always holds: a Tolerated action's findings are\nWaived, because accepting something without action is what waiving it means."
      enum:
      - Undetermined
      - Enforced
      - Tolerated
      - Clear
      type: string
      x-status: experimental
    EffectiveRequirement:
      description: "EffectiveRequirement is what a policy required of one requirement, as resolved\nat audit time: the text as it applied, the applicability that selected it, the\nconstraints the policy attached, and the plan bound to it. It is copied into\nthe audit on purpose. An audit is a point-in-time attestation, and a pointer\nalone stops saying what was audited once the catalog moves, retires the\nrequirement, or the policy's constraints change."
      properties:
        applicability:
          description: applicability names the groups under which this requirement was selected.
          items:
            type: string
          minItems: 1
          type: array
        constraints:
          description: constraints are the prescriptive additions the policy attached to it.
          items:
            properties:
              id:
                type: string
              text:
                type: string
            required:
            - id
            - text
            type: object
          type: array
        plan-id:
          description: plan-id names the assessment plan bound to this requirement.
          type: string
        text:
          description: text is the requirement as it applied, after the policy's constraints.
          type: string
      required:
      - text
      type: object
      x-status: experimental
    Email:
      description: Email represents a validated email address pattern
      pattern: "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"
      type: string
      x-status: stable
    EnforcementLog:
      allOf:
      - $ref: "#/components/schemas/Log"
      - required:
        - metadata
        - disposition
        - actions
      description: EnforcementLog records actions taken in response to noncompliance findings from Layer 5 evaluations.
      properties:
        actions:
          description: |-
            actions is the list of enforcement actions performed
            
            (Enforced by the CUE schema; not by this OpenAPI projection.)
          items:
            allOf:
            - $ref: "#/components/schemas/ActionResult"
            type: object
          minItems: 1
          type: array
        disposition:
          allOf:
          - $ref: "#/components/schemas/Disposition"
          description: "disposition is the aggregate across this log's actions, by the precedence\ndocumented on #Disposition."
        metadata:
          description: metadata provides detailed data about this log
          properties:
            type:
              enum:
              - EnforcementLog
              type: string
          required:
          - type
          type: object
      type: object
      x-status: experimental
    EnforcementMethodType:
      enum:
      - Gate
      - Remediation
      type: string
      x-status: experimental
    EnforcementStep:
      description: EnforcementStep is a reference to the code that performed an enforcement action
      type: string
      x-status: experimental
    Entity:
      description: Entity represents a human or tool
      properties:
        description:
          description: description provides additional context about the entity
          type: string
        id:
          description: id uniquely identifies the entity and allows this entry to be referenced by other elements
          type: string
        name:
          description: name is the name of the entity
          type: string
        type:
          allOf:
          - $ref: "#/components/schemas/EntityType"
          description: type specifies the type of entity interacting in the workflow
        uri:
          description: |-
            uri is a general URI for the entity information.
            Any URI scheme is accepted (e.g. https, file, oci, s3, arn) so entities
            hosted outside http(s) can be referenced.
          pattern: "^[a-zA-Z][a-zA-Z0-9+.-]*:[^\\s]+$"
          type: string
        version:
          description: version is the version of the entity (for tools; if applicable)
          type: string
      required:
      - id
      - name
      - type
      type: object
      x-status: stable
    EntityType:
      description: EntityType specifies what entity is interacting in the workflow
      enum:
      - Human
      - Software
      - Software Assisted
      type: string
      x-status: stable
    EntryMapping:
      description: EntryMapping represents how a specific entry maps to a MappingReference.
      properties:
        entry-id:
          description: entry-id is the identifier being mapped to in the referenced artifact
          type: string
        reference-id:
          description: reference-id is the id for a MappingReference entry in the artifact's metadata
          type: string
        remarks:
          description: remarks is prose describing the mapping relationship
          type: string
      required:
      - reference-id
      - entry-id
      type: object
      x-status: stable
    EntryType:
      description: EntryType enumerates the atomic units within Gemara artifacts that can participate in mappings
      enum:
      - Guideline
      - Statement
      - Control
      - AssessmentRequirement
      - Capability
      - Threat
      - Risk
      - Vector
      - Principle
