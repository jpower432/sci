    Imports:
      description: Imports defines external policies, controls, and guidelines required by this policy.
      properties:
        catalogs:
          items:
            $ref: "#/components/schemas/CatalogImport"
          minItems: 1
          type: array
        guidance:
          items:
            $ref: "#/components/schemas/GuidanceImport"
          minItems: 1
          type: array
        policies:
          items:
            $ref: "#/components/schemas/ArtifactMapping"
          minItems: 1
          type: array
      type: object
      x-status: experimental
    Justification:
      description: Justification provides the assessment data and exception references that justify an enforcement action.
      properties:
        exceptions:
          description: |-
            exceptions references the approved exceptions that authorise this action:
            a subject that cannot conform has been granted one, so evaluation still
            fails and enforcement stands down. Gemara does not model an exception, so
            these name external artifacts through the log's mapping-references.
          items:
            $ref: "#/components/schemas/ArtifactMapping"
          minItems: 1
          type: array
        findings:
          description: "findings links the action to the findings that justify it. Each carries an\nid, so an action or a later log can reference one unambiguously; a log\nreference, because an enforcement action reacts to an evaluation, so the\nfinding it acts on came from one; and a severity, because a finding a gate\nacted on is negative by nature. Unlike an audit finding, which may record\nconformity as readily as nonconformity, there is nothing to enforce against\ngood news, and a waived Critical is not a waived Low. This is the grading of\nnonconformities that certification bodies work to under ISO/IEC 17021-1,\nwhich #Severity carries."
          items:
            allOf:
            - $ref: "#/components/schemas/Finding"
            - required:
              - id
              - log
              - severity
            properties:
              id:
                type: string
              log:
                $ref: "#/components/schemas/EntryMapping"
              severity:
                $ref: "#/components/schemas/Severity"
            type: object
          minItems: 1
          type: array
      type: object
      x-status: experimental
