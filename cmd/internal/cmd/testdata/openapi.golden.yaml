        mapping-references:
          description: mapping-references is a list of external documents referenced within this artifact
          items:
            $ref: "#/components/schemas/MappingReference"
          minItems: 1
          type: array
        type:
          allOf:
          - $ref: "#/components/schemas/ArtifactType"
          description: type identifies the kind of Gemara artifact for unambiguous parsing
        version:
          description: version is the version identifier of this artifact
          type: string
      required:
      - id
      - type
      - gemara-version
      - description
      - author
      type: object
      x-status: stable
    MethodType:
      enum:
      - Behavioral
      - Intent
      - Remediation
      - Gate
      type: string
      x-status: experimental
    MethodVerification:
      description: MethodVerification records how one evaluation method fared against its plan.
      properties:
        allowed:
          allOf:
          - $ref: "#/components/schemas/Determination"
          description: "allowed records whether the plan permits this method. It is required: a\nmethod entry can always answer it, and an entry that names a method without\nsaying whether the plan accepts it has verified nothing."
        cadence-met:
          allOf:
          - $ref: "#/components/schemas/Determination"
          description: |-
            cadence-met records whether this method ran within the requirement's
            frequency-days. It is required because every plan states a frequency, so
            there is always a cadence to have met; a method that ran without the plan
            allowing it has none to meet, which is Not Applicable. It is recorded per
            method rather than per requirement so that a lagging method is named; the
            requirement's answer is the outcome above.
        executor-matched:
          allOf:
          - $ref: "#/components/schemas/Determination"
          description: |-
            executor-matched records whether the executor matched the plan's, compared
            by authoritative identifier rather than by internal short name.
        method-id:
          description: method-id names the accepted method this entry reports on.
          type: string
        parameters-matched:
          allOf:
          - $ref: "#/components/schemas/Determination"
          description: |-
            parameters-matched records whether the recorded parameter values are the
            ones the plan declares, within their accepted values.
        used:
          allOf:
          - $ref: "#/components/schemas/Determination"
          description: "used records whether this method was actually used. It is required for the\nsame reason as allowed: whether a method ran is always answerable, and a\nrequired method that did not run is the failure this list exists to surface."
      required:
      - method-id
      - allowed
      - used
      - cadence-met
      type: object
      x-status: experimental
    MitigatedRisk:
      description: MitigatedRisk represents a risk addressed by the policy
      properties:
        id:
          description: id allows this mitigated risk entry to be referenced by accepted risks
          type: string
        risk:
          allOf:
          - $ref: "#/components/schemas/EntryMapping"
          description: risk references the risk being mitigated
      required:
      - id
      - risk
      type: object
      x-status: experimental
    ModType:
      description: ModType defines the type of modification to the assessment requirement.
      enum:
      - Add
      - Modify
      - Remove
      - Replace
      - Override
      type: string
      x-status: experimental
    ModeType:
      enum:
      - Manual
      - Automated
      type: string
      x-status: experimental
    MultiEntryMapping:
      allOf:
      - $ref: "#/components/schemas/ArtifactMapping"
      - required:
        - entries
      description: MultiEntryMapping represents a mapping to an external reference with one or more entries.
      properties:
        entries:
          description: entries is a list of mapping entries
          items:
            $ref: "#/components/schemas/ArtifactMapping"
          minItems: 1
          type: array
      type: object
      x-status: stable
    Opinion:
      description: "Opinion is the audit's conclusion about the target as a whole: ISO 19011's audit\nconclusion, reached after weighing all of the findings against what the audit set\nout to establish. It carries the\naudit profession's four opinions: unqualified (Passed), qualified (Passed with\nConditions), adverse (Failed), and a disclaimer of opinion (Undetermined), when\nthe auditor could not obtain enough to conclude. It borrows #Result's tense\nbecause it answers the same shape of question at the scale of a whole audit.\n\nIt is a judgement, not a roll-up of verifications: whether requirements that\nwere not met are material enough to sink the audit is the auditor's call, and no\nprecedence over per-requirement outcomes can compute it. That is why it is\nstated rather than derived."
      enum:
      - Passed
      - Passed with Conditions
      - Failed
      - Undetermined
      type: string
      x-status: experimental
    Parameter:
      description: Parameter defines a configurable parameter for assessment or enforcement activities.
      properties:
        accepted-values:
          items:
            type: string
          minItems: 1
          type: array
        description:
          type: string
        id:
          type: string
        label:
          type: string
      required:
      - id
      - label
      - description
      type: object
      x-status: experimental
    PlanVerification:
      description: "PlanVerification records whether the plan bound to a requirement was followed.\nMethod-specific checks sit per method, because a plan may require several\nevaluation methods and each produces its own assessment: a single outcome per\nrequirement could not say which method fell short."
      properties:
        bound:
          allOf:
          - $ref: "#/components/schemas/Determination"
          description: |-
            bound records whether the assessment ran under the plan the policy binds to
            this requirement.
        methods:
          description: "methods records one entry per method involved: those the plan requires, and\nany that ran without the plan allowing them. At least one, because a plan\ndeclares at least one accepted method, so a plan verification that\nenumerates none has verified nothing about the methods."
          items:
            $ref: "#/components/schemas/MethodVerification"
          minItems: 1
          type: array
      required:
      - bound
      - methods
      type: object
      x-status: experimental
    Policy:
      description: Policy represents a policy document with metadata, contacts, scope, imports, implementation plan, risks, and adherence requirements.
      properties:
        adherence:
          $ref: "#/components/schemas/Adherence"
        contacts:
          $ref: "#/components/schemas/RACI"
        implementation-plan:
          $ref: "#/components/schemas/ImplementationPlan"
        imports:
          $ref: "#/components/schemas/Imports"
        metadata:
          allOf:
          - $ref: "#/components/schemas/Metadata"
          - required:
            - type
          properties:
            type:
              enum:
              - Policy
              type: string
          type: object
        risks:
          $ref: "#/components/schemas/Risks"
        scope:
          $ref: "#/components/schemas/Scope"
        title:
          type: string
      required:
      - title
      - metadata
      - contacts
      - scope
      - imports
      - adherence
      type: object
      x-status: experimental
    Principle:
      description: Principle represents a foundational value or tenet that guides governance, design, and operational decisions
      properties:
        description:
          description: description explains the principle and its expected outcomes
          type: string
        group:
          description: group references by id a catalog group that this principle belongs to
          type: string
        id:
          description: id allows this entry to be referenced by other elements
          type: string
        rationale:
          description: rationale provides the context for this principle
          type: string
        title:
          description: title describes the principle at a glance
          type: string
      required:
      - id
      - title
      - description
      - group
      type: object
      x-status: experimental
    PrincipleCatalog:
      allOf:
      - $ref: "#/components/schemas/Catalog"
      - required:
        - metadata
      description: PrincipleCatalog describes a set of related principles and relevant metadata
      properties:
        metadata:
          description: metadata provides detailed data about this catalog
          properties:
            type:
              enum:
              - PrincipleCatalog
              type: string
          required:
          - type
          type: object
        principles:
          description: |-
            principles is a list of unique principles defined by this catalog
            
            (Enforced by the CUE schema; not by this OpenAPI projection.)
          items:
            $ref: "#/components/schemas/Principle"
          minItems: 1
          type: array
      type: object
      x-status: experimental
    RACI:
      description: RACI defines the roles responsible for managing an artifact
      properties:
        accountable:
          description: accountable identifies the entity ultimately accountable for the outcome
          items:
            $ref: "#/components/schemas/Contact"
          minItems: 1
          type: array
        consulted:
          description: consulted identifies entities whose input is required when assessing or responding to the artifact
          items:
            $ref: "#/components/schemas/Contact"
          minItems: 1
          type: array
        informed:
          description: informed identifies entities that should be notified about changes to the artifact status
          items:
            $ref: "#/components/schemas/Contact"
          minItems: 1
          type: array
        responsible:
          description: responsible identifies the entities responsible for executing work to manage or mitigate the artifact
          items:
            $ref: "#/components/schemas/Contact"
          minItems: 1
          type: array
      required:
      - responsible
      - accountable
      type: object
      x-status: stable
    Rationale:
      description: Rationale provides a structured way to communicate a guideline author's intent
      properties:
        goals:
          description: goals is a list of outcomes this guideline seeks to achieve
          items:
            type: string
          minItems: 1
          type: array
        importance:
          description: importance is an explanation of why this guideline matters
          type: string
      required:
      - importance
      - goals
      type: object
      x-status: experimental
    Recommendation:
      description: Recommendation provides a corrective action for a finding.
      properties:
        id:
          description: id uniquely identifies this recommendation
          type: string
        required:
          default: false
          description: required indicates whether this recommendation is a mandatory corrective action
          type: boolean
        text:
          description: text describes the recommended corrective action
          type: string
      required:
      - text
      type: object
      x-status: experimental
    RelationshipType:
      description: RelationshipType enumerates the nature of the mapping between entries.
      enum:
      - implements
      - implemented-by
      - supports
      - supported-by
      - equivalent
      - subsumes
      - no-match
      - relates-to
      type: string
      x-status: experimental
    Resource:
      allOf:
      - $ref: "#/components/schemas/Entity"
      description: Resource represents an entity that exists in the system and can be evaluated
      properties:
        environment:
          description: environment describes where the resource exists (e.g., production, staging, development, specific region)
          type: string
        owner:
          allOf:
          - $ref: "#/components/schemas/Contact"
          description: owner is the contact information for the person or group responsible for managing or owning this resource
      type: object
      x-status: stable
    Result:
      enum:
      - Not Run
      - Passed
      - Failed
      - Needs Review
      - Not Applicable
      - Unknown
      type: string
      x-status: stable
    Risk:
      description: A Risk represents the potential for negative impact resulting from one or more threats.
      properties:
        description:
          description: description explains the risk scenario
          type: string
        group:
          description: group references by id a catalog group that this risk belongs to
          type: string
        id:
          description: id allows this risk to be referenced by other elements
          type: string
        impact:
          description: impact describes the business or operational impact
          type: string
        owner:
          allOf:
          - $ref: "#/components/schemas/RACI"
          description: owner defines the RACI roles responsible for managing this risk
        rank:
          description: |-
            rank optionally orders risks for the same catalog (e.g. when several share the same severity).
            Lower values mean higher relative importance. Omitted when the four severity levels are enough.
            When set, each value must be unique among all risks in the catalog that specify rank.
            
            (Enforced by the CUE schema; not by this OpenAPI projection.)
          type: integer
        severity:
          allOf:
          - $ref: "#/components/schemas/Severity"
          description: severity describes the assessed level of this risk
        threats:
          description: threats link this risk to Layer 2 threats
          items:
            $ref: "#/components/schemas/MultiEntryMapping"
          minItems: 1
          type: array
        title:
          description: title describes the risk
          type: string
      required:
      - id
      - title
      - description
      - group
      - severity
      type: object
      x-status: experimental
    RiskAppetite:
      description: RiskAppetite defines the acceptable level of exposure for a risk category
      enum:
      - Minimal
      - Low
      - Moderate
      - High
      type: string
      x-status: experimental
    RiskCatalog:
      allOf:
      - $ref: "#/components/schemas/Catalog"
      - required:
        - metadata
      description: |-
        A RiskCatalog is a structured collection of documented risks that may affect an organization,
        system, or service. It provides a centralized reference for risks that can be mapped to threats
        and referenced by policies when documenting how those risks are mitigated or accepted.
      properties:
        groups:
          description: groups narrows the base groups to risk categories with appetite and severity boundaries
          items:
            $ref: "#/components/schemas/RiskCategory"
          minItems: 1
          type: array
        metadata:
          description: metadata provides detailed data about this catalog
          properties:
            type:
              enum:
              - RiskCatalog
              type: string
          required:
          - type
          type: object
        risks:
          description: risks is a list of risks defined by this catalog
          items:
            $ref: "#/components/schemas/Risk"
          minItems: 1
          type: array
      type: object
      x-status: experimental
    RiskCategory:
      allOf:
      - $ref: "#/components/schemas/Group"
      - required:
        - appetite
      description: RiskCategory describes a grouping of risks and defines appetite boundaries
      properties:
        appetite:
          allOf:
          - $ref: "#/components/schemas/RiskAppetite"
          description: appetite defines the acceptable level of risk for this category
        max-severity:
          allOf:
          - $ref: "#/components/schemas/Severity"
          description: "max-severity defines the risk tolerance boundary: the highest severity\nthe organization will accept within this category"
      type: object
      x-status: experimental
    Risks:
      description: Risks defines mitigated and accepted risks addressed by this policy.
      properties:
        accepted:
          description: Accepted risks require rationale (justification) and may include scope. Controls addressing these risks are implicitly identified through threat mappings.
          items:
            $ref: "#/components/schemas/AcceptedRisk"
          minItems: 1
          type: array
        mitigated:
          description: Mitigated risks only need reference-id and risk-id (no justification required)
          items:
            $ref: "#/components/schemas/MitigatedRisk"
          minItems: 1
          type: array
      type: object
      x-status: experimental
    Scope:
      description: Scope defines what is included and excluded from policy applicability.
      properties:
        in:
          $ref: "#/components/schemas/Dimensions"
        out:
          $ref: "#/components/schemas/Dimensions"
      required:
      - in
      type: object
      x-status: experimental
    Severity:
      description: Severity defines the assessed level of a risk based on its potential impact and likelihood
      enum:
      - Low
      - Medium
      - High
      - Critical
      type: string
      x-status: experimental
    Statement:
      description: |-
        Statement represents a structural sub-requirement within a guideline;
        They do not increase strictness and all statements within a guideline apply together
      properties:
        id:
          description: id allows this entry to be referenced by other elements
          type: string
        recommendations:
          description: recommendations is a list of non-binding suggestions to aid in evaluation or enforcement of the statement
          items:
            type: string
          minItems: 1
          type: array
        text:
          description: text is the body of this statement
          type: string
        title:
          description: title describes the contents of this statement
          type: string
      required:
      - id
      - text
      type: object
      x-status: experimental
    Threat:
      description: Threat describes a specifically-scoped opportunity for a negative impact to the organization
      properties:
        actors:
          description: actors describes the relevant internal or external threat actors
          items:
            $ref: "#/components/schemas/Actor"
          minItems: 1
          type: array
        capabilities:
          description: capabilities documents the relationship between this threat and a system capability
          items:
            $ref: "#/components/schemas/MultiEntryMapping"
          minItems: 1
          type: array
        description:
          description: description provides a detailed explanation of an opportunity for negative impact
          type: string
        group:
          description: group references by id a catalog group that this threat belongs to
          type: string
        id:
          description: id allows this entry to be referenced by other elements
          type: string
        title:
          description: title describes this threat at a glance
          type: string
        vectors:
          description: vectors documents the relationship between this threat and one or more vectors
          items:
            $ref: "#/components/schemas/MultiEntryMapping"
          minItems: 1
          type: array
      required:
      - id
      - title
      - description
      - group
      - capabilities
      type: object
      x-status: stable
    ThreatCatalog:
      allOf:
      - $ref: "#/components/schemas/Catalog"
      - required:
        - metadata
      description: ThreatCatalog describes a set of topically-associated threats
      properties:
        metadata:
          description: metadata provides detailed data about this catalog
          properties:
            type:
              enum:
              - ThreatCatalog
              type: string
          required:
          - type
          type: object
        threats:
          description: threats is a list of threats defined by this catalog
          items:
            $ref: "#/components/schemas/Threat"
          minItems: 1
          type: array
      type: object
      x-status: stable
    TypedMapping:
      allOf:
      - $ref: "#/components/schemas/ArtifactMapping"
      - required:
        - entry-type
      description: TypedMapping extends ArtifactMapping with a required entry-type for all entries in this direction
      properties:
        entry-type:
          allOf:
          - $ref: "#/components/schemas/EntryType"
          description: entry-type identifies the type of atomic unit entries in this direction
      type: object
      x-status: experimental
    Vector:
      description: A Vector represents a method, pathway, or technique through which a threat may be realized or an attack may be carried out.
      properties:
        applicability:
          description: applicability specifies the contexts in which this vector can manifest
          items:
            type: string
          minItems: 1
          type: array
        description:
          description: description explains how the attack vector works
          type: string
        group:
          description: group references by id a catalog group that this vector belongs to
          type: string
        id:
          description: id allows this vector to be referenced by other elements
          type: string
        title:
          description: title describes the vector
          type: string
      required:
      - id
      - title
      - description
      - group
      type: object
      x-status: experimental
    VectorCatalog:
      allOf:
      - $ref: "#/components/schemas/Catalog"
      - required:
        - metadata
      properties:
        metadata:
          description: metadata provides detailed data about this catalog
          properties:
            type:
              enum:
              - VectorCatalog
              type: string
          required:
          - type
          type: object
        vectors:
          description: vectors is a list of attack vectors documented in this catalog
          items:
            $ref: "#/components/schemas/Vector"
          minItems: 1
          type: array
      type: object
      x-status: experimental
    VerificationLog:
      description: "VerificationLog records what an audit mechanically checked for one requirement,\nand how it came out. It is the audit's counterpart of #AssessmentLog: a record\nof a check that ran, carrying an outcome and no reasoning. Each check is a named\nfield so that a check never made is visible as a missing field rather than as an\nabsent list entry."
      properties:
        assessments:
          description: assessments are the assessments this audit read, if any.
          items:
            $ref: "#/components/schemas/EvidenceMapping"
          minItems: 1
          type: array
        effective:
          allOf:
          - $ref: "#/components/schemas/EffectiveRequirement"
          description: |-
            effective is what the policy actually required of it, resolved at audit
            time, so the record says what was audited without fetching the catalog.
        evidence:
          description: evidence records the data sources that support this result
          items:
            allOf:
            - $ref: "#/components/schemas/Evidence"
            type: object
          minItems: 1
          type: array
        evidence-fresh:
          allOf:
          - $ref: "#/components/schemas/Determination"
          description: "evidence-fresh records whether that evidence is current: collected within\nthe plan's valid-for-days where a plan sets one, and within the auditor's\njudgement where none does."
        evidence-present:
          allOf:
          - $ref: "#/components/schemas/Determination"
          description: "evidence-present records whether this requirement is backed by evidence at\nall: the question verifications exist to answer, and answering it for every\nrequirement is what makes them complete rather than selective. It may be\nomitted only where there was no evidence question to ask, which is a\nrequirement the policy puts out of scope — and omitting it then obliges an\noutcome of Not Applicable, so the omission cannot hide an entry that was\nsimply left unanswered."
        outcome:
          allOf:
          - $ref: "#/components/schemas/ComplianceStatus"
          description: "outcome is whether the target complies with this requirement. It is stated\nrather than left to be recomputed from the checks below or from the\nfindings: giving every requirement an answer is what this layer is for.\nA check that came out Not Satisfied is expected to show here, since a\nrequirement that is unevidenced, stale or unverified against its plan\ncannot be determined Satisfied. An outcome a reader would question is\nexplained by a finding naming this requirement, because nothing recorded\nhere reasons. Both relationships are documented rather than enforced, as\n#Result's roll-up precedence is."
        plan:
          allOf:
          - $ref: "#/components/schemas/PlanVerification"
          description: |-
            plan records whether the plan behind this requirement was followed. It is
            absent when no plan backed the requirement, which is how a verification says
            the requirement was evidenced without one, and required when effective
            names a plan-id.
        requirement:
          allOf:
          - $ref: "#/components/schemas/EntryMapping"
          description: "requirement names the assessment requirement this entry determines, and is\nalso this entry's identity: one entry per requirement, so a finding names\nthe requirement rather than a minted id."
      required:
      - outcome
      - requirement
      - effective
      type: object
      x-status: experimental
info:
  description: Gemara schema definitions
  title: Gemara
  version: golden
openapi: 3.0.3
paths: {}
