        - metadata
        - result
        - evaluations
      description: EvaluationLog contains the results of evaluating a set of Layer 2 controls.
      properties:
        evaluations:
          items:
            $ref: "#/components/schemas/ControlEvaluation"
          minItems: 1
          type: array
        metadata:
          description: metadata provides detailed data about this log
          properties:
            type:
              enum:
              - EvaluationLog
