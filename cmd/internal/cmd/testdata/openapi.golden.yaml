          description: source-reference identifies the artifact being mapped from; must match a mapping-reference id
        target-reference:
          allOf:
          - $ref: "#/components/schemas/TypedMapping"
          description: target-reference identifies the artifact being mapped to; must match a mapping-reference id
        title:
          description: title describes the purpose of this mapping document at a glance
          type: string
      required:
