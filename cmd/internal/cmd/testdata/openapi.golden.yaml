      x-status: stable
    Log:
      description: Log describes a set of recorded entries from a measurement activity
      properties:
        metadata:
          allOf:
          - $ref: "#/components/schemas/Metadata"
          description: metadata provides detailed data about this log
        target:
          allOf:
          - $ref: "#/components/schemas/Resource"
