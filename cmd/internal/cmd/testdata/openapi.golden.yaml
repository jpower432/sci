          pattern: "^(https?|file)://[^\\s]+$"
          type: string
      required:
      - citation
      type: object
      x-status: experimental
    LexiconTerm:
      description: LexiconTerm is a single definition within a lexicon
      properties:
        definition:
          description: definition explains the meaning of the term
          type: string
        id:
          description: id allows this entry to be referenced for anchors and tooling
          type: string
        references:
          description: references cites external authorities supporting the definition
          items:
            $ref: "#/components/schemas/LexiconReference"
          minItems: 1
          type: array
        synonyms:
          description: synonyms lists alternative labels that should resolve to this term for linking
          items:
            type: string
          minItems: 1
          type: array
        title:
          description: title is the canonical name of the defined concept
          type: string
      required:
      - id
      - title
      - definition
      type: object
      x-status: experimental
    Lifecycle:
      description: Lifecycle represents the lifecycle state of a guideline, control, or assessment requirement
      enum:
      - Active
      - Draft
      - Deprecated
      - Retired
