          - $ref: "#/components/schemas/RelationshipType"
          description: relationship describes the nature of the mapping between source and all targets
        remarks:
          description: remarks is general prose regarding this mapping
          type: string
        source:
          description: source identifies the entry being mapped from by its entry-id
          type: string
        targets:
          description: targets identifies the entries being mapped to; absent when relationship is no-match
          items:
            $ref: "#/components/schemas/MappingTarget"
          minItems: 1
          type: array
      required:
      - id
      - source
      - relationship
      type: object
      x-status: experimental
    MappingDocument:
      description: MappingDocument captures the user's intent for how entries in a source artifact relate to entries in a target artifact
      properties:
        mappings:
          description: mappings is one or more atomic relationships between entries in the referenced artifacts
          items:
            $ref: "#/components/schemas/Mapping"
          minItems: 1
