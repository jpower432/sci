      - Regulation
      - Best Practice
      - Framework
      type: string
      x-status: experimental
    Guideline:
      description: Guideline provides explanatory context and recommendations for designing optimal outcomes
      properties:
        applicability:
          description: applicability specifies the contexts in which this guideline applies
          items:
            type: string
          minItems: 1
          type: array
        extends:
          allOf:
          - $ref: "#/components/schemas/EntryMapping"
          description: extends is an id for a guideline which this guideline adds to, in this document or elsewhere
        group:
          description: group provides an id to the group that this guideline belongs to
          type: string
        id:
          description: id allows this entry to be referenced by other elements
          type: string
        objective:
          description: objective is a unified statement of intent, which may encompass multiple situationally applicable statements
          type: string
        principles:
          description: principles documents the relationship between this guideline and one or more principles
          items:
            $ref: "#/components/schemas/MultiEntryMapping"
          minItems: 1
          type: array
        rationale:
          allOf:
          - $ref: "#/components/schemas/Rationale"
          description: rationale provides the context for this guideline
        recommendations:
          description: recommendations is a list of non-binding suggestions to aid in evaluation or enforcement of the guideline
          items:
            type: string
          minItems: 1
          type: array
        replaced-by:
          allOf:
          - $ref: "#/components/schemas/EntryMapping"
          description: replaced-by references the guideline that supersedes this one when deprecated or retired
        see-also:
          description: see-also lists related guideline IDs within the same GuidanceCatalog
          items:
            type: string
          minItems: 1
          type: array
        state:
          allOf:
          - $ref: "#/components/schemas/Lifecycle"
          default: Active
          description: state is the lifecycle state of this guideline
        statements:
          description: statements is a list of structural sub-requirements within a guideline
          items:
            $ref: "#/components/schemas/Statement"
          minItems: 1
          type: array
        title:
          description: title describes the contents of this guideline
          type: string
        vectors:
          description: vector-mappings documents the relationship between this guideline and one or more vectors
          items:
            $ref: "#/components/schemas/MultiEntryMapping"
          minItems: 1
          type: array
      required:
