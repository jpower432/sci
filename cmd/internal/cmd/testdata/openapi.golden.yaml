        entry-id:
          description: entry-id identifies the specific entry in the target artifact
          type: string
        rationale:
          description: rationale explains why this relationship exists for this target
          type: string
        remarks:
          description: remarks is general prose regarding this target mapping
          type: string
        strength:
          description: strength is the author's estimate of how completely the source satisfies this target; range 1-10
          maximum: 10.0
          minimum: 1.0
