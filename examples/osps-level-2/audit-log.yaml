      for members of the project.
    applicability:
    - Maturity2
    - Maturity3
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-GV-01.02
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-GV-02.01
  effective:
