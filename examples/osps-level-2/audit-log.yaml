metadata:
  id: OSPS-L2-AUDIT-2026Q1
  type: AuditLog
  gemara-version: 1.1.0
  version: 1.0.0
  description: Q1 2026 audit of gemaraproj/gemara against the OSPS Level 2 adherence policy.
  author:
    id: lead-auditor
    name: Jane Auditor
    type: Human
  mapping-references:
  - id: OSPS-L2-POLICY
    title: OpenSSF Baseline Adherence Policy — Maturity Level 2
    version: '2026.1'
  - id: OSPS-B
    title: Open Source Project Security Baseline
    version: 1.0.0
    url: https://baseline.openssf.org
  - id: eval-log
    title: Baseline Scanner Evaluation Log
    version: '2026-03-28'
    url: https://artifacts.example.com/eval-logs/2026-03-28.yaml
target:
  id: gemara-repo
  name: gemaraproj/gemara
  type: Software
  uri: https://github.com/gemaraproj/gemara
  environment: production
owner:
  responsible:
  - name: Jane Auditor
    affiliation: External Audit Firm
  accountable:
  - name: Project Lead
    affiliation: OpenSSF
summary: Access control, legal and security-assessment requirements are met. Six requirements are
  not met, none of them on a control the target's security posture depends on, and two could not be
  determined from the evidence available in the window. Nineteen Maturity Level 3 requirements are
  out of scope under this policy.
opinion: Passed with Conditions
policy:
  reference-id: OSPS-L2-POLICY
  remarks: Adherence policy adopting the OSPS baseline at Maturity Level 2.
verifications:
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-AC-01.01
  effective:
    text: When a user attempts to access a sensitive resource in the project's version control system,
      the system MUST require the user to complete a multi-factor authentication process.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
    plan-id: AP-OSPS-AC-01.01
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-AC-01.01
  plan:
    bound: Satisfied
    methods:
    - method-id: EM-OSPS-AC-01.01-probe
      allowed: Satisfied
      used: Satisfied
      executor-matched: Satisfied
      cadence-met: Satisfied
      parameters-matched: Satisfied
    - method-id: EM-OSPS-AC-01.01-review
      allowed: Satisfied
      used: Satisfied
      cadence-met: Satisfied
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-AC-02.01
  effective:
    text: When a new collaborator is added, the version control system MUST require manual permission
      assignment, or restrict the collaborator permissions to the lowest available privileges by default.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
    plan-id: AP-OSPS-AC-02.01
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-AC-02.01
  plan:
    bound: Satisfied
    methods:
    - method-id: EM-OSPS-AC-02.01-probe
      allowed: Satisfied
      used: Satisfied
      executor-matched: Satisfied
      cadence-met: Satisfied
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-AC-03.01
  effective:
    text: When a direct commit is attempted on the project's primary branch, an enforcement mechanism
      MUST prevent the change from being applied.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
    plan-id: AP-OSPS-AC-03.01
  outcome: Undetermined
  evidence-present: Satisfied
  evidence-fresh: Not Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-AC-03.01
  plan:
    bound: Satisfied
    methods:
    - method-id: EM-OSPS-AC-03.01-probe
      allowed: Satisfied
      used: Satisfied
      executor-matched: Satisfied
      cadence-met: Not Satisfied
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-AC-03.02
  effective:
    text: When an attempt is made to delete the project's primary branch, the version control system
      MUST treat this as a sensitive activity and require explicit confirmation of intent.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
    plan-id: AP-OSPS-AC-03.02
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-AC-03.02
  plan:
    bound: Satisfied
    methods:
    - method-id: EM-OSPS-AC-03.02-probe
      allowed: Satisfied
      used: Satisfied
      executor-matched: Satisfied
      cadence-met: Satisfied
    - method-id: EM-OSPS-AC-03.02-review
      allowed: Satisfied
      used: Satisfied
      cadence-met: Satisfied
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-AC-04.01
  effective:
    text: When a CI/CD task is executed with no permissions specified, the project's version control
      system MUST default to the lowest available permissions for all activities in the pipeline.
    applicability:
    - Maturity2
    - Maturity3
    plan-id: AP-OSPS-AC-04.01
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-AC-04.01
  plan:
    bound: Satisfied
    methods:
    - method-id: EM-OSPS-AC-04.01-probe
