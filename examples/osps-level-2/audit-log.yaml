    entry-id: OSPS-BR-06.01
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-DO-01.01
  effective:
    text: When the project has made a release, the project documentation MUST include user guides
      for all basic functionality.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
  outcome: Not Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-DO-01.01
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-DO-02.01
  effective:
    text: When the project has made a release, the project documentation MUST include a guide for
      reporting defects.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
  outcome: Not Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-DO-02.01
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-DO-03.02
  effective:
    text: When the project has made a release, the project documentation MUST contain instructions
      to verify the expected identity of the person or process authoring the software release.
