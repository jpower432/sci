      allowed: Satisfied
      used: Satisfied
      executor-matched: Satisfied
      cadence-met: Satisfied
      parameters-matched: Satisfied
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-BR-05.01
  effective:
    text: When a build and release pipeline ingests dependencies, it MUST use standardized tooling
      where available.
    applicability:
    - Maturity2
    - Maturity3
    plan-id: AP-OSPS-BR-05.01
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
