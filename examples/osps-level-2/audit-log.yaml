      used: Satisfied
      executor-matched: Satisfied
      cadence-met: Satisfied
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-BR-01.01
  effective:
    text: When a CI/CD pipeline accepts an input parameter, that parameter MUST be sanitized and validated
      prior to use in the pipeline.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
