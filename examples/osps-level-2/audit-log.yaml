    entry-id: OSPS-QA-02.02
  effective:
    text: When the project has made a release, all compiled released software assets MUST be delivered
      with a software bill of materials.
    applicability:
    - Maturity3
  outcome: Not Applicable
  evidence-present: Not Applicable
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-QA-03.01
  effective:
    text: When a commit is made to the primary branch, any automated status checks for commits MUST
      pass or be manually bypassed.
    applicability:
    - Maturity2
    - Maturity3
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-QA-03.01
