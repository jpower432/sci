    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-QA-01.02
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-QA-02.01
