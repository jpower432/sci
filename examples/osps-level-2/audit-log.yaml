    - method-id: EM-OSPS-BR-03.02-review
      allowed: Satisfied
      used: Satisfied
      cadence-met: Satisfied
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-BR-04.01
  effective:
    text: When an official release is created, that release MUST contain a descriptive log of functional
      and security modifications.
    applicability:
    - Maturity2
    - Maturity3
    plan-id: AP-OSPS-BR-04.01
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
