      cadence-met: Satisfied
      parameters-matched: Satisfied
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-BR-01.02
  effective:
    text: When a CI/CD pipeline uses a branch name in its functionality, that name value MUST be sanitized
      and validated prior to use in the pipeline.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
    plan-id: AP-OSPS-BR-01.02
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-BR-01.02
  plan:
