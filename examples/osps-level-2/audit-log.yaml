- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-BR-02.01
  effective:
    text: When an official release is created, that release MUST be assigned a unique version identifier.
    applicability:
    - Maturity2
    - Maturity3
    plan-id: AP-OSPS-BR-02.01
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-BR-02.01
  plan:
    bound: Satisfied
    methods:
    - method-id: EM-OSPS-BR-02.01-probe
      allowed: Satisfied
      used: Satisfied
      executor-matched: Satisfied
      cadence-met: Satisfied
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-BR-03.01
  effective:
    text: When the project lists a URI as an official project channel, that URI MUST be exclusively
      delivered using encrypted channels.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
