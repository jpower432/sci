  plan:
    bound: Satisfied
    methods:
    - method-id: EM-OSPS-BR-05.01-probe
      allowed: Satisfied
      used: Satisfied
      executor-matched: Satisfied
      cadence-met: Satisfied
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-BR-06.01
  effective:
    text: When an official release is created, that release MUST be signed or accounted for in a signed
