      proposed changes and usage obstacles.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
  outcome: Not Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-GV-02.01
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-GV-03.01
  effective:
    text: While active, the project documentation MUST include an explanation of the contribution
      process.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-GV-03.01
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-GV-03.02
  effective:
    text: While active, the project documentation MUST include a guide for code contributors that
      includes requirements for acceptable contributions.
    applicability:
    - Maturity2
    - Maturity3
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-GV-03.02
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-GV-04.01
  effective:
    text: While active, the project documentation MUST have a policy that code contributors are reviewed
      prior to granting escalated permissions to sensitive resources.
    applicability:
    - Maturity3
  outcome: Not Applicable
  evidence-present: Not Applicable
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-LE-01.01
  effective:
    text: While active, the version control system MUST require all code contributors to assert that
      they are legally authorized to make the associated contributions on every commit.
    applicability:
    - Maturity2
    - Maturity3
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-LE-01.01
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-LE-02.01
  effective:
    text: While active, the license for the source code MUST meet the OSI Open Source Definition or
      the FSF Free Software Definition.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
  outcome: Undetermined
  evidence-present: Undetermined
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-LE-02.02
  effective:
    text: While active, the license for the released software assets MUST meet the OSI Open Source
      Definition or the FSF Free Software Definition.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-LE-02.02
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-LE-03.01
  effective:
    text: While active, the license for the source code MUST be maintained in the corresponding repository's
      LICENSE file, COPYING file, or LICENSE/ directory.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-LE-03.01
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-LE-03.02
  effective:
    text: While active, the license for the released software assets MUST be included in the released
      source code, or in a LICENSE file, COPYING file, or LICENSE/ directory alongside the corresponding
      release assets.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-LE-03.02
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-QA-01.01
  effective:
    text: While active, the project's source code repository MUST be publicly readable at a static
      URL.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-QA-01.01
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-QA-01.02
  effective:
    text: The version control system MUST contain a publicly readable record of all changes made,
