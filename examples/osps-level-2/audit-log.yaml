- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-BR-03.02
  effective:
    text: When the project lists a URI as an official distribution channel, that URI MUST be exclusively
      delivered using encrypted channels.
    applicability:
    - Maturity1
    - Maturity2
    - Maturity3
    plan-id: AP-OSPS-BR-03.02
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
