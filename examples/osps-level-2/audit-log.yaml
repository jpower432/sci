      statement about the scope and duration of support for each release.
    applicability:
    - Maturity3
  outcome: Not Applicable
  evidence-present: Not Applicable
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-DO-05.01
  effective:
    text: When the project has made a release, the project documentation MUST provide a descriptive
      statement when releases or versions will no longer receive security updates.
    applicability:
    - Maturity3
  outcome: Not Applicable
  evidence-present: Not Applicable
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-DO-06.01
  effective:
    text: When the project has made a release, the project documentation MUST include a description
      of how the project selects, obtains, and tracks its dependencies.
    applicability:
    - Maturity2
    - Maturity3
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-DO-06.01
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-GV-01.01
  effective:
    text: While active, the project documentation MUST include a list of project members with access
      to sensitive resources.
    applicability:
    - Maturity2
    - Maturity3
  outcome: Compliant
  evidence-present: Satisfied
  evidence-fresh: Satisfied
  assessments:
  - reference-id: eval-log
    entry-id: OSPS-GV-01.01
- requirement:
    reference-id: OSPS-B
    entry-id: OSPS-GV-01.02
  effective:
