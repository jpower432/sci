title: OpenSSF Baseline Adherence Policy — Maturity Level 2
metadata:
  id: OSPS-L2-POLICY
  type: Policy
  gemara-version: 1.1.0
  version: '2026.1'
  description: Adherence policy adopting the OpenSSF Project Security Baseline at Maturity Level 2
    for repositories this organization maintains.
  author:
    id: security-office
    name: Security Office
    type: Human
  mapping-references:
  - id: OSPS-B
    title: Open Source Project Security Baseline
    version: 1.0.0
    url: https://baseline.openssf.org
contacts:
  responsible:
  - name: Security Office
    affiliation: Example Org
  accountable:
  - name: VP Engineering
    affiliation: Example Org
scope:
  in:
    technologies:
    - Git
    - GitHub Actions
    groups:
    - Maturity2
  out:
    groups:
    - Maturity3
imports:
  catalogs:
  - reference-id: OSPS-B
    exclusions:
    - OSPS-AC-04.02
    - OSPS-BR-02.02
    - OSPS-DO-03.01
implementation-plan:
  notification-process: Announced on the internal engineering list 30 days ahead.
  evaluation-timeline:
    start: '2026-01-01T00:00:00Z'
    notes: Evaluation begins with the Q1 scan cycle.
  enforcement-timeline:
    start: '2026-07-01T00:00:00Z'
    notes: Enforcement begins after two full evaluation cycles, so a failing repository has had notice.
adherence:
  evaluation-methods:
  - id: EM-BASELINE-SCAN
    type: Behavioral
    mode: Automated
    required: true
    description: Baseline scanner run across every in-scope repository.
  assessment-plans:
  - id: AP-OSPS-AC-01.01
    requirement:
      reference-id: OSPS-B
      entry-id: OSPS-AC-01.01
    frequency-days: 30
    evaluation-methods:
    - id: EM-OSPS-AC-01.01-probe
      type: Behavioral
      mode: Automated
      required: true
      description: Automated probe run by the baseline scanner.
      executor:
        id: pvtr
        name: pvtr-github-repo
        type: Software
    - id: EM-OSPS-AC-01.01-review
      type: Intent
      mode: Manual
      required: false
      description: Maintainer review of the published policy text.
    evidence-requirements:
      description: Scanner output for this requirement.
      valid-for-days: 90
    parameters:
    - id: P-OSPS-AC-01.01-window
      label: Lookback window
      description: Days of history the probe inspects.
      accepted-values:
      - '30'
      - '90'
  - id: AP-OSPS-AC-02.01
    requirement:
      reference-id: OSPS-B
      entry-id: OSPS-AC-02.01
    frequency-days: 90
    evaluation-methods:
    - id: EM-OSPS-AC-02.01-probe
