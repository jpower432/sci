metadata:
  id: audit-log-001
  type: AuditLog
  gemara-version: "1.1.0"
  version: "1.0.0"
  description: "Q1 2026 Gemara Audit"
  author:
    id: lead-auditor
    name: "Jane Auditor"
    type: Human
  mapping-references:
    - id: security-policy
      title: "Information Security Policy"
      version: "2.1.0"
      type: Policy

    - id: OSPS
      title: "Open Source Project Security Baseline"
      version: "2025.1"
      url: "https://baseline.openssf.org"
      type: ControlCatalog

    - id: eval-log
      title: "PVTR Evaluation Log"
      version: "2025-08-22"
      url: "https://artifacts.example.com/eval-logs/pvtr-baseline-scan.yaml"
      type: EvaluationLog

    - id: enforcement-log
      title: "Example Enforcement Log"
      version: "2025-08-22"
      url: "https://artifacts.example.com/enforcement-logs/enforcement-log-001.yaml"
      type: EnforcementLog

    - id: github-api
      title: "GitHub Dependency Graph API"
      version: "2026"
      url: "https://docs.github.com/en/rest/dependency-graph"
    - id: SCG
      title: "Secure Development Guidance"
      version: "1.2"
      type: GuidanceCatalog
      url: "https://guidance.example.com/secure-development"
    - id: risk-catalog
      title: "Organizational Risk Catalog"
      version: "2026.1"
      url: "https://artifacts.example.com/risk-catalog.yaml"
      type: RiskCatalog


target:
  id: gemara-repo
  name: "gemaraproj/gemara"
  type: Software
  uri: "https://github.com/gemaraproj/gemara"
  environment: production

owner:
  responsible:
    - name: "Jane Auditor"
      affiliation: "External Audit Firm"
  accountable:
    - name: "Project Lead"
      affiliation: "OpenSSF"

policy:
  reference-id: security-policy
  remarks: "Organizational policy establishing the audit's criteria; it imports the OSPS baseline."

objectives:
  - "Establish whether the target meets the requirements the policy binds to it."
  - "Establish whether the evidence behind each determination was obtained as the policy requires."

verifications:
  # No plan is bound, so there is nothing to have conformed to.
  - requirement:
      reference-id: OSPS
      entry-id: OSPS-AC-01.01
    effective:
      text: "When a user attempts to access a sensitive resource in the project's version
        control system, the system MUST require multi-factor authentication."
      applicability:
        - Maturity Level 1
    plan-conformance: Not Applicable
    outcome: Satisfied
    assessments:
      - reference-id: eval-log
        entry-id: OSPS-AC-01.01

  # A plan is bound and was not followed: the probe ran outside its cadence.
  - requirement:
      reference-id: OSPS
      entry-id: OSPS-DO-01.01
    effective:
      text: "The project MUST publish user documentation describing how to install and
        use the software."
      applicability:
        - Maturity Level 1
      constraints:
        - id: c-annual-review
          text: "Review the published user documentation at least annually."
      plan-id: plan-doc-review
    plan-conformance: Not Satisfied
    outcome: Not Satisfied
    assessments:
      - reference-id: eval-log
        entry-id: OSPS-DO-01.01
    evidence:
      - id: EV-DO-01
        type: EvaluationLog
        description: "PVTR evaluation results for documentation controls"
        collected-at: "2025-08-22T16:02:00Z"
        source:
          reference-id: eval-log
          entry-id: "assessment-do-01"
          digest: "sha256:c4d5e6f7a8b9012cdef34567890abcdef1234567890abcdef1234567890abc12"

  - requirement:
      reference-id: OSPS
      entry-id: OSPS-DO-02.01
    effective:
      text: "The project MUST provide a private channel for reporting suspected
        vulnerabilities."
      applicability:
        - Maturity Level 1
    plan-conformance: Not Applicable
    outcome: Not Satisfied
    evidence:
      - id: EV-DO-02
        type: EnforcementLog
        description: "Enforcement actions taken for documentation failures"
        collected-at: "2025-08-22T16:05:00Z"
        source:
          reference-id: enforcement-log

  # Evidence that does not describe itself, so the entry says what established the outcome.
  - requirement:
      reference-id: OSPS
      entry-id: OSPS-QA-02.01
    effective:
      text: "The project MUST publish dependency manifests enumerating its direct
        dependencies."
      applicability:
        - Maturity Level 2
    plan-conformance: Not Applicable
    outcome: Satisfied
    basis: "The SBOM endpoint returned a manifest enumerating all 41 direct dependencies,
      each with a resolved version."
    evidence:
      - id: EV-QA-01
        type: urn:gemara:evidence:api-response
        description: "Dependency manifests from the GitHub dependency graph SBOM endpoint"
        collected-at: "2026-02-10T15:05:00Z"
        source:
          reference-id: github-api
          coordinate: "/repos/gemaraproj/gemara/dependency-graph/sbom"
          digest: "sha256:a1b2c3d4e5f67890abcdef1234567890abcdef1234567890abcdef1234567890"
  # A requirement the policy adopted from guidance rather than from a control
  # catalog. Importing guidance makes it binding, so it is verified like any other.
  - requirement:
      reference-id: SCG
      entry-id: SCG-REVIEW.01
    effective:
      text: "Every change to the default branch is reviewed by someone other than its
        author before merge."
      applicability:
        - Maturity Level 1
    plan-conformance: Not Applicable
    outcome: Satisfied
    basis: "Branch protection requires one approving review from a non-author on the
      default branch, confirmed from the repository settings response."
    evidence:
      - id: EV-SCG-01
        type: urn:gemara:evidence:api-response
        description: "Branch protection settings for the default branch"
        collected-at: "2026-02-10T15:07:00Z"
        source:
          reference-id: github-api
          coordinate: "/repos/gemaraproj/gemara/branches/main/protection"
          digest: "sha256:b7c8d9e0f1a2b3c4d5e6f7089abcdef1234567890abcdef1234567890abcdef1"

attainment:
  - objective:
      reference-id: OSPS
      entry-id: OSPS-AC-01
    statement: "Access to sensitive resources in the project's version control system is
      restricted to authenticated, authorized users."
    implementation: Satisfied
    attainment: Satisfied
    basis: "Organization-wide MFA enforcement covers every repository in scope, so the
      objective holds beyond the single requirement tested."
    requirements:
      - reference-id: OSPS
        entry-id: OSPS-AC-01.01

  # The requirements below it are proxies, and one of them passing does not carry the
  # objective: users still cannot find out how to install the software.
  - objective:
      reference-id: OSPS
      entry-id: OSPS-DO-01
    statement: "A user can obtain, install and operate the software from the project's
      own documentation."
    implementation: Satisfied
    attainment: Not Satisfied
    basis: "No user guide exists, so nothing the project publishes lets a user install
      the software unaided."
    requirements:
      - reference-id: OSPS
        entry-id: OSPS-DO-01.01

  - objective:
      reference-id: OSPS
      entry-id: OSPS-DO-02
    statement: "A reporter can disclose a suspected vulnerability privately to the project."
    implementation: Satisfied
    attainment: Not Satisfied
    basis: "Private reporting was enabled only after the audit window, so no private
      channel existed during the period examined."
    requirements:
      - reference-id: OSPS
        entry-id: OSPS-DO-02.01

  # A mandate the policy adopted and then selected nothing to implement. The
  # verifications cannot show this: every requirement the policy did select is
  # satisfied, and this objective simply has none bearing on it.
  - objective:
      reference-id: SCG
      entry-id: SCG-SUPPLY
    statement: "The provenance of every released artifact can be established by a
      consumer without trusting the build system operator."
    implementation: Not Satisfied
    attainment: Undetermined
    basis: "The policy adopted this guidance and selected no requirement implementing
      it, so nothing was assessed and the audit has no basis to say whether the target
      achieves it."

  # The objective of the guideline, judged the same way a control's objective is.
  - objective:
      reference-id: SCG
      entry-id: SCG-REVIEW
    statement: "Changes reach the default branch only after independent scrutiny."
    implementation: Satisfied
    attainment: Satisfied
    basis: "Review is enforced by branch protection rather than by convention, and no
      bypass was configured during the period examined."
    requirements:
      - reference-id: SCG
        entry-id: SCG-REVIEW.01

  - objective:
      reference-id: OSPS
      entry-id: OSPS-QA-02
    statement: "A consumer can determine what the project depends on."
    implementation: Satisfied
    attainment: Satisfied
    requirements:
      - reference-id: OSPS
        entry-id: OSPS-QA-02.01

findings:
  - id: AR-DO-01
    status: Not Compliant
    severity: Medium
    lifecycle: Open
    description: "No user guide is published or referenced in the Security Insights data,
      and the review the plan requires ran outside its cadence."
    requirement:
      reference-id: OSPS
      entry-id: OSPS-DO-01.01
    recommendations:
      - id: REC-01
        text: "Add user guide references to the Security Insights file and publish basic user documentation."
        required: true

  - id: AR-DO-02
    status: Not Compliant
    severity: High
    lifecycle: Open
    description: "Private vulnerability reporting was not enabled prior to enforcement remediation."
    requirement:
      reference-id: OSPS
      entry-id: OSPS-DO-02.01
    recommendations:
      - id: REC-02
        text: "Formalize the private vulnerability reporting process and document it in SECURITY.md."

  # A finding may record conformity: ISO 19011 findings indicate conformity or nonconformity.
  - id: AR-AC-01
    status: Compliant
    lifecycle: Resolved
    description: "Multi-factor authentication is enforced organization-wide rather than per
      repository, which satisfies this requirement for every repository in scope."
    requirement:
      reference-id: OSPS
      entry-id: OSPS-ZZ-99.01

  - id: AR-RISK-01
    status: Not Compliant
    severity: Critical
    lifecycle: Open
    description: "Residual risk RISK-002 remains above the maximum severity its category tolerates."
    risk:
      reference-id: risk-catalog
      entry-id: RISK-002
    recommendations:
      - id: REC-03
        text: "Add a compensating control or record a documented risk acceptance."

opinion: Failed

summary: "Access control and quality requirements are satisfied. Two documentation
  requirements are not, one of them on evidence obtained outside the plan's cadence, and a
  residual risk remains above tolerance. The audit examined evidence collected between
  August 2025 and February 2026; conditions may have changed since."
