metadata:
  id: audit-log-plan-unnamed
  type: AuditLog
  gemara-version: "1.1.0"
  version: "1.0.0"
  description: "Invalid audit log: a plan verification naming no plan-id"
  author:
    id: lead-auditor
    name: "Jane Auditor"
    type: Human
  mapping-references:
    - id: security-policy
      title: "Information Security Policy"
      version: "2.1.0"
    - id: OSPS
      title: "Open Source Project Security Baseline"
      version: "2025.1"
      url: "https://baseline.openssf.org"
    - id: eval-log
      title: "PVTR Evaluation Log"
      version: "2025-08-22"
      url: "https://artifacts.example.com/eval-logs/pvtr-baseline-scan.yaml"
    - id: enforcement-log
      title: "Example Enforcement Log"
      version: "2025-08-22"
      url: "https://artifacts.example.com/enforcement-logs/enforcement-log-001.yaml"
    - id: github-api
      title: "GitHub Dependency Graph API"
      version: "2026"
      url: "https://docs.github.com/en/rest/dependency-graph"
    - id: risk-catalog
      title: "Organizational Risk Catalog"
      version: "2026.1"
      url: "https://artifacts.example.com/risk-catalog.yaml"

target:
  id: gemara-repo
  name: "gemaraproj/gemara"
  type: Software
  uri: "https://github.com/gemaraproj/gemara"
  environment: production
  owner:
    name: "Gemara Maintainers"
    affiliation: "OpenSSF"

owner:
  responsible:
    - name: "Jane Auditor"
      affiliation: "External Audit Firm"
  accountable:
    - name: "Project Lead"
      affiliation: "OpenSSF"

summary: "Access control and quality controls are strong. Documentation controls have gaps requiring remediation."

opinion: Failed

policy:
  reference-id: security-policy
  remarks: "Organizational policy establishing the audit's scope; it imports the OSPS baseline."

verifications:
  - requirement:
      reference-id: OSPS
      entry-id: OSPS-AC-01
    effective:
      text: "When a user attempts to access a sensitive resource in the project's version
        control system, the system MUST require multi-factor authentication."
      applicability:
        - Maturity Level 1
    outcome: Compliant
    evidence-present: Satisfied
    evidence-fresh: Satisfied
    evidence:
      - id: EV-AC-01
        type: EvaluationLog
        description: "PVTR evaluation results for access control"
        collected-at: "2025-08-22T16:00:00Z"
        source:
          reference-id: eval-log
          entry-id: "assessment-ac-01"

  - requirement:
      reference-id: OSPS
      entry-id: OSPS-DO-01
    effective:
      text: "The project MUST publish user documentation describing how to install and
        use the software."
      applicability:
        - Maturity Level 1
      constraints:
        - id: c-annual-review
          text: "Review the published user documentation at least annually."
    outcome: Not Compliant
    evidence-present: Satisfied
    evidence-fresh: Satisfied
    plan:
      bound: Satisfied
      methods:
        - method-id: m-intent
          allowed: Satisfied
          used: Satisfied
          executor-matched: Satisfied
          cadence-met: Satisfied
        - method-id: m-behavioral
          allowed: Satisfied
          used: Not Satisfied
          cadence-met: Not Satisfied
    evidence:
      - id: EV-DO-01
        type: EvaluationLog
        description: "PVTR evaluation results for documentation controls"
        collected-at: "2025-08-22T16:02:00Z"
        source:
          reference-id: eval-log
          entry-id: "assessment-do-01"
          digest: "sha256:c4d5e6f7a8b9012cdef34567890abcdef1234567890abcdef1234567890abc12"

  - requirement:
      reference-id: OSPS
      entry-id: OSPS-DO-02
    effective:
      text: "The project MUST provide a private channel for reporting suspected
        vulnerabilities."
      applicability:
        - Maturity Level 1
    outcome: Not Compliant
    evidence-present: Satisfied
    evidence:
      - id: EV-DO-02
        type: EnforcementLog
        description: "Enforcement actions taken for documentation failures"
        collected-at: "2025-08-22T16:05:00Z"
        source:
          reference-id: enforcement-log

  - requirement:
      reference-id: OSPS
      entry-id: OSPS-QA-02
    effective:
      text: "The project MUST publish dependency manifests enumerating its direct
        dependencies."
      applicability:
        - Maturity Level 2
    outcome: Compliant
    evidence-present: Satisfied
    evidence:
      - id: EV-QA-01
        type: urn:gemara:evidence:api-response
        description: "Dependency manifests from the GitHub dependency graph SBOM endpoint"
        collected-at: "2026-02-10T15:05:00Z"
        source:
          reference-id: github-api
          coordinate: "/repos/gemaraproj/gemara/dependency-graph/sbom"
          digest: "sha256:a1b2c3d4e5f67890abcdef1234567890abcdef1234567890abcdef1234567890"

findings:
  - id: AR-DO-01
    status: Not Compliant
    severity: Medium
    description: "No user guide is published or referenced in the Security Insights data."
    requirement:
      reference-id: OSPS
      entry-id: OSPS-DO-01
    recommendations:
      - id: REC-01
        text: "Add user guide references to the Security Insights file and publish basic user documentation."
        required: true

  - id: AR-DO-03
    status: Not Compliant
    severity: Low
    description: "The behavioral probe the plan requires did not run in this period, so
      the documentation review rests on the intent method alone."
    requirement:
      reference-id: OSPS
      entry-id: OSPS-DO-01
    recommendations:
      - id: REC-04
        text: "Restore the behavioral probe to the documentation review pipeline."

  - id: AR-DO-02
    status: Not Compliant
    severity: High
    description: "Private vulnerability reporting was not enabled prior to enforcement remediation."
    requirement:
      reference-id: OSPS
      entry-id: OSPS-DO-02
    recommendations:
      - id: REC-02
        text: "Formalize the private vulnerability reporting process and document it in SECURITY.md."

  - id: AR-RISK-01
    status: Not Compliant
    severity: Critical
    description: "Residual risk RISK-002 remains above the maximum severity its category tolerates."
    risk:
      reference-id: risk-catalog
      entry-id: RISK-002
    recommendations:
      - id: REC-03
        text: "Add a compensating control or record a documented risk acceptance."
