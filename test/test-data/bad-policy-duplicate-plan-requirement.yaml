metadata:
  id: BAD-DUP-PLAN
  type: Policy
  gemara-version: "1.1.0"
  version: "1.0.0"
  description: Assessment plan ids must be unique within a policy, so AssessmentLog.plan
    and AssessmentFinding.plan resolve to one plan.
  author:
    id: security-team
    name: Security Team
    type: Human
  mapping-references:
    - id: "ISO-27001"
      title: "ISO/IEC 27001"
      version: "2022"
      description: "Information security management systems"
title: Policy with duplicate assessment plan ids
contacts:
  responsible:
    - name: IT Director
  accountable:
    - name: Chief Information Security Officer
scope:
  in:
    technologies:
      - Web Applications
imports:
  guidance:
    - reference-id: ISO-27001
adherence:
  assessment-plans:
    - id: AP-01
      requirement:
        reference-id: ISO-27001
        entry-id: EX.C01.R01
      frequency-days: 90
      evaluation-methods:
        - id: EV-AUTO-01
          type: Behavioral
          mode: Automated
    # Same requirement: an evaluation would have no way to choose between them.
    - id: AP-02
      requirement:
        reference-id: ISO-27001
        entry-id: EX.C01.R01
      frequency-days: 365
      evaluation-methods:
        - id: EV-AUTO-02
          type: Behavioral
          mode: Automated
  non-compliance: Non-compliant systems are quarantined pending remediation.
